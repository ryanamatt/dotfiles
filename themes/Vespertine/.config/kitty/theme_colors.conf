mark3_background        #ff9e7d

# --- 16-color terminal palette ---
# Vespertine re-mapping: keeps semantic meaning (red = error, green = ok)
# but pulls every hue through the purple void.

# black  -- void / shadow
color0   #0b0f19
color8   #2d3d5c

# red  -- rose error
color1   #d95252
color9   #f07373

# green  -- mint success (otherworldly, not earthy)
color2   #5ecf9a
color10  #7de8b0

# yellow  -- arcane gold
color3   #c9933b
color11  #f5b042

# blue  -- deep void blue (shifted purple-ward)
color4   #4a75a0
color12  #7ec8e3

# magenta  -- fae / vivid purple (the heart of the palette)
color5   #e86b45
color13  #ff9e7d

# cyan  -- mist teal
color6   #6fc2c8
color14  #a8e8ec

# white  -- petal / silver
color7   #b0bcd4
color15  #edf2f8
