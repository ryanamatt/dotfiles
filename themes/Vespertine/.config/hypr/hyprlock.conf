# hyprlock.conf
#
# Palette:
#   midnight  #0b0f19    shadow    #1e2942
#   coral     #f27d52    sunset    #e86b45
#   peach     #ff9e7d    snow      #edf2f8
#   mist      #8493af    amber     #d99b36
#   rust      #d95252    kelp      #5ecf9a
#
# shortcuts: ESC, Ctrl+U, Ctrl+Backspace -- clear password buffer

$font        = Iosevka Nerd Font Propo
$font_bold   = Iosevka Nerd Font Propo

# --- General ---
general {
    hide_cursor      = true
    grace            = 0
    no_fade_in       = false
    no_fade_out      = false
    ignore_empty_input = false
}

# --- Animations ---
animations {
    enabled = true

    bezier = voidRise,  0.23, 1,    0.32, 1      # easeOutQuint -- matches Hyprland
    bezier = voidFade,  0.5,  0.5,  0.75, 1      # almostLinear
    bezier = linear,    1,    1,    0,    0

    animation = fadeIn,           1, 6,  voidRise
    animation = fadeOut,          1, 4,  voidFade
    animation = inputFieldDots,   1, 3,  voidRise
    animation = inputFieldFade,   1, 4,  voidFade
    animation = inputFieldWidth,  1, 5,  voidRise
}

# --- Background ---
# Screenshot of the desktop, heavily blurred + darkened into the void
background {
    monitor =
    path         = screenshot
    blur_passes  = 4
    blur_size    = 8
    brightness   = 0.4
    contrast     = 0.9
    vibrancy     = 0.2
    vibrancy_darkness = 0.6
}

# --- Clock -- large, centered ---
label {
    monitor =
    text      = $TIME
    font_size = 96
    font_family = $font_bold
    color     = rgba(edf2f8ff)       # snow

    shadow_passes = 3
    shadow_size   = 10
    shadow_color  = rgba(e86b4560)   # sunset glow

    position = 0, 120
    halign   = center
    valign   = center
}

# --- Date ---
label {
    monitor =
    text      = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color     = rgba(f27d52ff)       # coral

    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(0b0f1980)

    position = 0, 52
    halign   = center
    valign   = center
}

# --- Flavor text -- arcane inscription above the input field ---
label {
    monitor =
    text      = ✦  watch the city fade to dusk  ✦
    font_size = 13
    font_family = $font
    color     = rgba(8493afcc)       # mist, slightly transparent

    position = 0, -60
    halign   = center
    valign   = center
}

# --- Password input field ---
input-field {
    monitor =
    size             = 380, 52
    outline_thickness = 2
    rounding         = 12

    # Transparent fill -- blur behind shows through
    inner_color      = rgba(141b2c80)

    # Idle border: coral → peach gradient
    outer_color      = rgba(f27d52ff) rgba(ff9e7dff) 45deg

    # Checking: amber pulse
    check_color      = rgba(d99b36ff) rgba(f27d52ff) 90deg

    # Fail: rose red
    fail_color       = rgba(d95252ff) rgba(e86b45ff) 40deg

    font_color       = rgba(edf2f8ff)  # snow
    font_family      = $font

    fade_on_empty    = true
    placeholder_text = <i>passphrase...</i>
    fail_text        = <b>$PAMFAIL</b>
    check_text       = <i>divining...</i>

    dots_size        = 0.28
    dots_spacing     = 0.35
    dots_center      = true

    position = 0, -20
    halign   = center
    valign   = center
}

# --- User / avatar label ---
label {
    monitor =
    text      =  $USER
    font_size = 16
    font_family = $font
    color     = rgba(8cbcd9ff)       # bloom lavender

    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(0b0f1999)

    position = 0, 30
    halign   = center
    valign   = center
}

# --- Keyboard layout indicator ---
label {
    monitor =
    text    = $LAYOUT[en,ru]
    font_size = 14
    font_family = $font
    color   = rgba(8493af99)         # mist, dim

    onclick = hyprctl switchxkblayout all next

    position = 0, -90
    halign   = center
    valign   = center
}
