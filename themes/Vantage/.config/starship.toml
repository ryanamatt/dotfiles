# Vantage Shell
#
# Requires: Nerd Fonts (any complete variant, e.g. JetBrainsMono Nerd Font)
# Install : Copy to ~/.config/starship.toml

# --- Prompt layout ---
# Line 1:  [glyph] [os]  [directory]  [git_branch] [git_status]
#          [language runtimes ...]
# Line 2:  [time]  [status/character]

format = """
$os\
$username\
$hostname\
[  ](fg:#283c60)\
$directory\
[](fg:#283c60 bg:#182644)\
$git_branch\
$git_status\
[](fg:#182644 bg:none)\
$fill\
$python\
$nodejs\
$rust\
$golang\
$java\
$lua\
$package\
$cmd_duration\
$line_break\
$time\
$status\
$character"""

# --- Palette ---
palette = "Vantage"

[palettes.Vantage]
night        = "#080c18"
deep        = "#0f1830"
shadow      = "#182644"
dusk        = "#283c60"
spark      = "#d94f9e"
frost       = "#8fc4e0"
snow       = "#eef2f5"
bloom     = "#e0479e"
fuchsia         = "#ff6ec7" 
amber        = "#e8a23c"
silver      = "#a9b8cc"
mist        = "#7e93b5"
scarlet         = "#d9484f"      # error rose
green       = "#7de8b0"      # success mint (otherworldly, not typical green)
ice        = "#8fd4e0" 

# --- OS / entry glyph ---
[os]
format = "[$symbol]($style) "
style = "bold fg:bloom"
disabled = false

[os.symbols]
Arch        = "󰣇"
Unknown     = "󰬯"

# --- Username ---
[username]
format = "[$user]($style)"
style_user = "bold fg:frost"
style_root = "bold fg:scarlet"
show_always = false

# --- Hostname ---
[hostname]
format = "[@$hostname]($style) "
style = "fg:mist"
ssh_only = true

# --- Directory ---
[directory]
format = "[ 🛏 $path ]($style)[$read_only]($read_only_style)"
style = "bold fg:snow bg:#283c60"
read_only = " 󰌾 "
read_only_style = "fg:scarlet bg:#283c60"
truncation_length = 4
truncation_symbol = "󰇘 "
home_symbol = "󱂵 ~"

[directory.substitutions]
"Documents" = "󰈙 Docs"
"Downloads" = " DL"
"Music"     = "󰝚 Music"
"Pictures"  = "󰋩 Pics"
"Videos"    = "󰕧 Vids"
"Desktop"   = "󰟀 Desktop"
".config"   = "󱁿 cfg"
".local"    = "󰮂 local"
"src"       = "󰅩 src"
"projects"  = "󰏗 projects"

# --- Git Branch ---
[git_branch]
format = "[ $symbol$branch(:$remote_branch) ]($style)"
symbol = "󰘬 "
style = "bold fg:fuchsia bg:#182644"
truncation_length = 24
truncation_symbol = "󰇘"

# --- Git Status ---
[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "fg:amber bg:#182644"
conflicted  = " 󱗃 "
ahead       = " ⇡${count}"
behind      = " ⇣${count}"
diverged    = " 󰹺 ⇡${ahead_count}⇣${behind_count}"
untracked   = " 󰐗${count}"
stashed     = " 󰏗 "
modified    = " 󰝶${count}"
staged      = " 󰸞${count}"
renamed     = " 󰑕${count}"
deleted     = " 󰩺${count}"

# --- Fill (right-align runtimes) ---
[fill]
symbol = " "
style = "fg:night"

# --- Language runtimes ---
[python]
format = "[ $symbol$version ]($style)"
symbol = "󰌠 "
style = "fg:spark"
version_format = "v${major}.${minor}"

[nodejs]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:green"
version_format = "v${major}.${minor}"

[rust]
format = "[ $symbol$version ]($style)"
symbol = "󱘗 "
style = "fg:frost"
version_format = "v${major}.${minor}"

[golang]
format = "[ $symbol$version ]($style)"
symbol = "󰟓 "
style = "fg:ice"
version_format = "v${major}.${minor}"

[java]
format = "[ $symbol$version ]($style)"
symbol = "󰬷 "
style = "fg:amber"
version_format = "v${major}.${minor}"

[lua]
format = "[ $symbol$version ]($style)"
symbol = "󰢱 "
style = "fg:spark"
version_format = "v${major}.${minor}"

[package]
format = "[ 󰏗 $version ]($style)"
style = "fg:silver"
version_format = "v${raw}"

# --- Command duration ---
[cmd_duration]
format = "[ 󱞩 $duration ]($style)"
style = "fg:mist"
min_time = 2_000
show_milliseconds = false

# --- Time (second line, left) ---
[time]
format = "[󱑃 $time ]($style)"
style = "fg:mist"
time_format = "%H:%M"
disabled = false

# --- Exit status ---
[status]
format = "[$symbol$status ]($style)"
symbol = " "
success_symbol = ""
not_executable_symbol = "󰌾 "
not_found_symbol = "󰩺 "
sigint_symbol = "󰆐 "
style = "bold fg:scarlet"
map_symbol = true
disabled = false

# --- Prompt character ---
[character]
format = "$symbol "
success_symbol = "[🎆](bold fg:bloom)"
error_symbol   = "[❄](bold fg:scarlet)"
vimcmd_symbol  = "[🪟](bold fg:fuchsia)"
