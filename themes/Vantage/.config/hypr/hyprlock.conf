# hyprlock.conf
#
# Palette:
#   night     #080c18    shadow    #182644
#   spark     #d94f9e    bloom     #e0479e
#   fuchsia   #ff6ec7    snow      #eef2f5
#   mist      #7e93b5    amber     #e8a23c
#   scarlet   #d9484f    mint      #5ecf9a
#
# shortcuts: ESC, Ctrl+U, Ctrl+Backspace -- clear password buffer

$font        = Iosevka Nerd Font Propo
$font_bold   = Iosevka Nerd Font Propo

# --- General ---
general {
    hide_cursor      = true
    grace            = 0
    no_fade_in       = false
    no_fade_out      = false
    ignore_empty_input = false
}

# --- Animations ---
animations {
    enabled = true

    bezier = voidRise,  0.23, 1,    0.32, 1      # easeOutQuint -- matches Hyprland
    bezier = voidFade,  0.5,  0.5,  0.75, 1      # almostLinear
    bezier = linear,    1,    1,    0,    0

    animation = fadeIn,           1, 6,  voidRise
    animation = fadeOut,          1, 4,  voidFade
    animation = inputFieldDots,   1, 3,  voidRise
    animation = inputFieldFade,   1, 4,  voidFade
    animation = inputFieldWidth,  1, 5,  voidRise
}

# --- Background ---
# Screenshot of the desktop, heavily blurred + darkened into the void
background {
    monitor =
    path         = screenshot
    blur_passes  = 4
    blur_size    = 8
    brightness   = 0.4
    contrast     = 0.9
    vibrancy     = 0.2
    vibrancy_darkness = 0.6
}

# --- Clock -- large, centered ---
label {
    monitor =
    text      = $TIME
    font_size = 96
    font_family = $font_bold
    color     = rgba(eef2f5ff)       # snow

    shadow_passes = 3
    shadow_size   = 10
    shadow_color  = rgba(e0479e60)   # bloom glow

    position = 0, 120
    halign   = center
    valign   = center
}

# --- Date ---
label {
    monitor =
    text      = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color     = rgba(d94f9eff)       # spark

    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(080c1880)

    position = 0, 52
    halign   = center
    valign   = center
}

# --- Flavor text -- arcane inscription above the input field ---
label {
    monitor =
    text      = ✦  watch the sky burn slow  ✦
    font_size = 13
    font_family = $font
    color     = rgba(7e93b5cc)       # mist, slightly transparent

    position = 0, -60
    halign   = center
    valign   = center
}

# --- Password input field ---
input-field {
    monitor =
    size             = 380, 52
    outline_thickness = 2
    rounding         = 12

    # Transparent fill -- blur behind shows through
    inner_color      = rgba(0f183080)

    # Idle border: spark → fuchsia gradient
    outer_color      = rgba(d94f9eff) rgba(ff6ec7ff) 45deg

    # Checking: amber pulse
    check_color      = rgba(e8a23cff) rgba(d94f9eff) 90deg

    # Fail: rose red
    fail_color       = rgba(d9484fff) rgba(e0479eff) 40deg

    font_color       = rgba(eef2f5ff)  # snow
    font_family      = $font

    fade_on_empty    = true
    placeholder_text = <i>passphrase...</i>
    fail_text        = <b>$PAMFAIL</b>
    check_text       = <i>divining...</i>

    dots_size        = 0.28
    dots_spacing     = 0.35
    dots_center      = true

    position = 0, -20
    halign   = center
    valign   = center
}

# --- User / avatar label ---
label {
    monitor =
    text      =  $USER
    font_size = 16
    font_family = $font
    color     = rgba(8fc4e0ff)       # bloom lavender

    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(080c1899)

    position = 0, 30
    halign   = center
    valign   = center
}

# --- Keyboard layout indicator ---
label {
    monitor =
    text    = $LAYOUT[en,ru]
    font_size = 14
    font_family = $font
    color   = rgba(7e93b599)         # mist, dim

    onclick = hyprctl switchxkblayout all next

    position = 0, -90
    halign   = center
    valign   = center
}
