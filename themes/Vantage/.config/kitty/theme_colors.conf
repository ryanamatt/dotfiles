mark3_foreground        #080c18
mark3_background        #ff6ec7

# --- 16-color terminal palette ---
# Vantage re-mapping: keeps semantic meaning (red = error, green = ok)
# but pulls every hue through the purple void.

# black  -- void / shadow
color0   #080c18
color8   #283c60

# red  -- rose error
color1   #d9484f
color9   #f0707a

# green  -- mint success (otherworldly, not earthy)
color2   #5ecf9a
color10  #7de8b0

# yellow  -- arcane gold
color3   #c9963c
color11  #e8a23c

# blue  -- deep void blue (shifted purple-ward)
color4   #4a6fa0
color12  #7fa8d8

# magenta  -- fae / vivid purple (the heart of the palette)
color5   #e0479e
color13  #ff6ec7

# cyan  -- mist teal
color6   #6fc0c8
color14  #a8e8ec

# white  -- petal / silver
color7   #a9b8cc
color15  #eef2f5
