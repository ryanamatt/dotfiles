# --- 16-color terminal palette ---
# Windward re-mapping: keeps semantic meaning (red = error, green = ok)
# but pulls every hue through the deep sea teal.

# black  -- abyss / shadow
color0   #0a1a1d
color8   #2d6b66

# red  -- rust error
color1   #c9603f
color9   #e08066

# green  -- kelp success (earthy sea-green, not otherworldly)
color2   #6fbf73
color10  #8fe093

# yellow  -- windward brass
color3   #b3923f
color11  #c9a24a

# blue  -- sea-shifted blue
color4   #4f83a8
color12  #7da8c9

# magenta  -- teal / anchor accent (the heart of the palette)
color5   #1f7a6c
color13  #5fd9c4

# cyan  -- mist teal
color6   #6fb8b0
color14  #a8d8e0

# white  -- canvas / silver
color7   #b8c4c0
color15  #ede3c8