# hyprlock.conf
#
# Palette:
#   abyss     #0a1a1d    shadow    #1e4b4f
#   foam      #4fa88f    teal      #1f7a6c
#   aqua      #5fd9c4    canvas    #ede3c8
#   mist      #7fa89f    brass     #c9a24a
#   rust      #c9603f    kelp      #6fbf73
#
# shortcuts: ESC, Ctrl+U, Ctrl+Backspace — clear password buffer

$font        = Iosevka Nerd Font Propo
$font_bold   = Iosevka Nerd Font Propo

# --- General ---
general {
    hide_cursor      = true
    grace            = 0
    no_fade_in       = false
    no_fade_out      = false
    ignore_empty_input = false
}

# --- Animations ---
animations {
    enabled = true

    bezier = tideRise,  0.23, 1,    0.32, 1      # easeOutQuint — matches Hyprland
    bezier = tideFade,  0.5,  0.5,  0.75, 1      # almostLinear
    bezier = linear,    1,    1,    0,    0

    animation = fadeIn,           1, 6,  tideRise
    animation = fadeOut,          1, 4,  tideFade
    animation = inputFieldDots,   1, 3,  tideRise
    animation = inputFieldFade,   1, 4,  tideFade
    animation = inputFieldWidth,  1, 5,  tideRise
}

# --- Background ---
# Screenshot of the desktop, heavily blurred + darkened into the deep water
background {
    monitor =
    path         = screenshot
    blur_passes  = 4
    blur_size    = 8
    brightness   = 0.4          # darken toward the abyss
    contrast     = 0.9
    vibrancy     = 0.2          # let the sea-teal bleed through
    vibrancy_darkness = 0.6
}

# --- Clock — large, centered ---
label {
    monitor =
    text      = $TIME
    font_size = 96
    font_family = $font_bold
    color     = rgba(ede3c8ff)       # canvas

    shadow_passes = 3
    shadow_size   = 10
    shadow_color  = rgba(1f7a6c60)   # teal glow

    position = 0, 120
    halign   = center
    valign   = center
}

# --- Date ---
label {
    monitor =
    text      = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color     = rgba(4fa88fff)       # foam

    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(0a1a1d80)

    position = 0, 52
    halign   = center
    valign   = center
}

# --- Flavor text — dock inscription above the input field ---
label {
    monitor =
    text      = ✦  state your bearings  ✦
    font_size = 13
    font_family = $font
    color     = rgba(7fa89fcc)       # mist, slightly transparent

    position = 0, -60
    halign   = center
    valign   = center
}

# --- Password input field ---
input-field {
    monitor =
    size             = 380, 52
    outline_thickness = 2
    rounding         = 12

    # Transparent fill — blur behind shows through
    inner_color      = rgba(12333880)

    # Idle border: foam → aqua gradient
    outer_color      = rgba(4fa88fff) rgba(5fd9c4ff) 45deg

    # Checking: brass pulse
    check_color      = rgba(c9a24aff) rgba(4fa88fff) 90deg

    # Fail: rust red
    fail_color       = rgba(c9603fff) rgba(1f7a6cff) 40deg

    font_color       = rgba(ede3c8ff)  # canvas
    font_family      = $font

    fade_on_empty    = true
    placeholder_text = <i>passphrase...</i>
    fail_text        = <b>$PAMFAIL</b>
    check_text       = <i>charting course...</i>

    dots_size        = 0.28
    dots_spacing     = 0.35
    dots_center      = true

    position = 0, -20
    halign   = center
    valign   = center
}

# --- User / avatar label ---
label {
    monitor =
    text      =  $USER
    font_size = 16
    font_family = $font
    color     = rgba(8fc4d9ff)       # sky

    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(0a1a1d99)

    position = 0, 30
    halign   = center
    valign   = center
}

# --- Keyboard layout indicator ---
label {
    monitor =
    text    = $LAYOUT[en,ru]
    font_size = 14
    font_family = $font
    color   = rgba(7fa89f99)         # mist, dim

    onclick = hyprctl switchxkblayout all next

    position = 0, -90
    halign   = center
    valign   = center
}
