# Windward Shell
#
# Requires: Nerd Fonts (any complete variant, e.g. JetBrainsMono Nerd Font)
# Install : Copy to ~/.config/starship.toml

# --- Prompt layout ---
# Line 1:  [glyph] [os]  [directory]  [git_branch] [git_status]
#          [language runtimes ...]
# Line 2:  [time]  [status/character]

format = """
$os\
$username\
$hostname\
[  ](fg:#2d6b66)\
$directory\
[](fg:#2d6b66 bg:#1e4b4f)\
$git_branch\
$git_status\
[](fg:#1e4b4f bg:none)\
$fill\
$python\
$nodejs\
$rust\
$golang\
$java\
$lua\
$package\
$cmd_duration\
$line_break\
$time\
$status\
$character"""

# --- Palette ---
palette = "windward"

[palettes.windward]
abyss       = "#0a1a1d"      # near-black with a teal tinge
deep        = "#123338"      # dark sea-green background
shadow      = "#1e4b4f"      # medium-dark teal
dusk        = "#2d6b66"      # segment mid-tone
foam        = "#4fa88f"      # kitty cursor — sea-green
sky         = "#8fc4d9"      # lighter sky-blue
canvas      = "#ede3c8"      # pale sail-cream (text on dark)
teal        = "#1f7a6c"      # hyprland border — deep anchor teal
aqua        = "#5fd9c4"      # bright aqua highlight
brass       = "#c9a24a"      # windward brass accent
silver      = "#b8c4c0"      # muted grey-green
mist        = "#7fa89f"      # desaturated mid-teal
red         = "#c9603f"      # error rust
green       = "#6fbf73"      # success kelp (earthy sea-green)
cyan        = "#a8d8e0"      # info sky-cyan

# --- OS / entry glyph ---
[os]
format = "[$symbol]($style) "
style = "bold fg:teal"
disabled = false

[os.symbols]
Arch        = "󰣇"
Unknown     = "󰬯"   # fallback icon — verify glyph renders in your Nerd Font

# --- Username ---
[username]
format = "[$user]($style)"
style_user = "bold fg:sky"
style_root = "bold fg:red"
show_always = false

# --- Hostname ---
[hostname]
format = "[@$hostname]($style) "
style = "fg:mist"
ssh_only = true

# --- Directory ---
[directory]
format = "[ 🧭 $path ]($style)[$read_only]($read_only_style)"
style = "bold fg:canvas bg:#2d6b66"
read_only = " 󰌾 "
read_only_style = "fg:red bg:#2d6b66"
truncation_length = 4
truncation_symbol = "󰇘 "
home_symbol = "󱂵 ~"

[directory.substitutions]
"Documents" = "󰈙 Docs"
"Downloads" = " DL"
"Music"     = "󰝚 Music"
"Pictures"  = "󰋩 Pics"
"Videos"    = "󰕧 Vids"
"Desktop"   = "󰟀 Desktop"
".config"   = "󱁿 cfg"
".local"    = "󰮂 local"
"src"       = "󰅩 src"
"projects"  = "󰏗 projects"

# --- Git Branch ---
[git_branch]
format = "[ $symbol$branch(:$remote_branch) ]($style)"
symbol = "󰘬 "
style = "bold fg:aqua bg:#1e4b4f"
truncation_length = 24
truncation_symbol = "󰇘"

# --- Git Status ---
[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "fg:brass bg:#1e4b4f"
conflicted  = " 󱗃 "
ahead       = " ⇡${count}"
behind      = " ⇣${count}"
diverged    = " 󰹺 ⇡${ahead_count}⇣${behind_count}"
untracked   = " 󰐗${count}"
stashed     = " 󰏗 "
modified    = " 󰝶${count}"
staged      = " 󰸞${count}"
renamed     = " 󰑕${count}"
deleted     = " 󰩺${count}"

# --- Fill (right-align runtimes) ---
[fill]
symbol = " "
style = "fg:abyss"

# --- Language runtimes ---
[python]
format = "[ $symbol$version ]($style)"
symbol = "󰌠 "
style = "fg:foam"
version_format = "v${major}.${minor}"

[nodejs]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:green"
version_format = "v${major}.${minor}"

[rust]
format = "[ $symbol$version ]($style)"
symbol = "󱘗 "
style = "fg:sky"
version_format = "v${major}.${minor}"

[golang]
format = "[ $symbol$version ]($style)"
symbol = "󰟓 "
style = "fg:cyan"
version_format = "v${major}.${minor}"

[java]
format = "[ $symbol$version ]($style)"
symbol = "󰬷 "
style = "fg:brass"
version_format = "v${major}.${minor}"

[lua]
format = "[ $symbol$version ]($style)"
symbol = "󰢱 "
style = "fg:foam"
version_format = "v${major}.${minor}"

[package]
format = "[ 󰏗 $version ]($style)"
style = "fg:silver"
version_format = "v${raw}"

# --- Command duration ---
[cmd_duration]
format = "[ 󱞩 $duration ]($style)"
style = "fg:mist"
min_time = 2_000
show_milliseconds = false

# --- Time (second line, left) ---
[time]
format = "[󱑃 $time ]($style)"
style = "fg:mist"
time_format = "%H:%M"
disabled = false

# --- Exit status ---
[status]
format = "[$symbol$status ]($style)"
symbol = "⛈ "          # storm — the voyage hit trouble
success_symbol = ""    # hidden on success
not_executable_symbol = "󰌾 "
not_found_symbol = "󰩺 "
sigint_symbol = "󰆐 "
style = "bold fg:red"
map_symbol = true
disabled = false

# --- Prompt character ---
[character]
format = "$symbol "
success_symbol = "[⚓](bold fg:teal)"    # anchor on success
error_symbol   = "[⛈](bold fg:red)"     # storm on error
vimcmd_symbol  = "[⛵](bold fg:aqua)"    # sail on vim normal mode