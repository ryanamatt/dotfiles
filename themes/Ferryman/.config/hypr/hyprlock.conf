# hyprlock.conf
#
# Palette:
#   styx      #050a10    shadow    #16293d
#   wisp      #5a7a94    lantern   #f2a83c
#   flame     #ffcf6b    pale      #dceaf2
#   mist      #7e93a8    rune      #f5c842
#   blood     #c9455a    wraith    #5ecf9a
#
# shortcuts: ESC, Ctrl+U, Ctrl+Backspace — clear password buffer

$font        = Iosevka Nerd Font Propo
$font_bold   = Iosevka Nerd Font Propo

# --- General ---
general {
    hide_cursor      = true
    grace            = 0
    no_fade_in       = false
    no_fade_out      = false
    ignore_empty_input = false
}

# --- Animations ---
animations {
    enabled = true

    bezier = styxRise,  0.23, 1,    0.32, 1      # easeOutQuint — matches Hyprland
    bezier = styxFade,  0.5,  0.5,  0.75, 1      # almostLinear
    bezier = linear,    1,    1,    0,    0

    animation = fadeIn,           1, 6,  styxRise
    animation = fadeOut,          1, 4,  styxFade
    animation = inputFieldDots,   1, 3,  styxRise
    animation = inputFieldFade,   1, 4,  styxFade
    animation = inputFieldWidth,  1, 5,  styxRise
}

# --- Background ---
# Screenshot of the desktop, heavily blurred + darkened into the deep water
background {
    monitor =
    path         = screenshot
    blur_passes  = 4
    blur_size    = 8
    brightness   = 0.4          # darken toward the deep
    contrast     = 0.9
    vibrancy     = 0.2          # let the frost-blue bleed through
    vibrancy_darkness = 0.6
}

# --- Clock — large, centered ---
label {
    monitor =
    text      = $TIME
    font_size = 96
    font_family = $font_bold
    color     = rgba(dceaf2ff)       # pale

    shadow_passes = 3
    shadow_size   = 10
    shadow_color  = rgba(f2a83c60)   # lantern glow

    position = 0, 120
    halign   = center
    valign   = center
}

# --- Date ---
label {
    monitor =
    text      = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color     = rgba(5a7a94ff)       # wisp

    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(050a1080)

    position = 0, 52
    halign   = center
    valign   = center
}

# --- Flavor text — ferryman's toll above the input field ---
label {
    monitor =
    text      = ✦  pay the ferryman's toll  ✦
    font_size = 13
    font_family = $font
    color     = rgba(7e93a8cc)       # mist, slightly transparent

    position = 0, -60
    halign   = center
    valign   = center
}

# --- Password input field ---
input-field {
    monitor =
    size             = 380, 52
    outline_thickness = 2
    rounding         = 12

    # Transparent fill — blur behind shows through
    inner_color      = rgba(0d1b2b80)

    # Idle border: wisp → flame gradient
    outer_color      = rgba(5a7a94ff) rgba(ffcf6bff) 45deg

    # Checking: rune pulse
    check_color      = rgba(f5c842ff) rgba(5a7a94ff) 90deg

    # Fail: blood red
    fail_color       = rgba(c9455aff) rgba(f2a83cff) 40deg

    font_color       = rgba(dceaf2ff)  # pale
    font_family      = $font

    fade_on_empty    = true
    placeholder_text = <i>passphrase...</i>
    fail_text        = <b>$PAMFAIL</b>
    check_text       = <i>divining...</i>

    dots_size        = 0.28
    dots_spacing     = 0.35
    dots_center      = true

    position = 0, -20
    halign   = center
    valign   = center
}

# --- User / avatar label ---
label {
    monitor =
    text      =  $USER
    font_size = 16
    font_family = $font
    color     = rgba(a8c8d9ff)       # frost blue

    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(050a1099)

    position = 0, 30
    halign   = center
    valign   = center
}

# --- Keyboard layout indicator ---
label {
    monitor =
    text    = $LAYOUT[en,ru]
    font_size = 14
    font_family = $font
    color   = rgba(7e93a899)         # mist, dim

    onclick = hyprctl switchxkblayout all next

    position = 0, -90
    halign   = center
    valign   = center
}