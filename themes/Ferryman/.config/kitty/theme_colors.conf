# --- 16-color terminal palette ---
# Ferryman re-mapping: keeps semantic meaning (red = error, green = ok)
# but pulls every hue through the cold blue-black chill.

# black  -- styx / dusk
color0   #050a10
color8   #1f3c54

# red  -- blood error
color1   #c9455a
color9   #de6b7a

# green  -- wraith mint success (otherworldly, not earthy)
color2   #5ecf9a
color10  #7de0b0

# yellow  -- ferryman rune
color3   #b3923a
color11  #f5c842

# blue  -- deep sea blue (cold-shifted)
color4   #4a6f94
color12  #7fa8cc

# magenta  -- lantern (the heart of the palette)
color5   #f2a83c
color13  #ffcf6b

# cyan  -- mist rime
color6   #6fb8c4
color14  #a8e8ec

# white  -- pale / silver
color7   #b8c4cc
color15  #dceaf2