# --- 16-color terminal palette ---
# Glade re-mapping: keeps semantic meaning (red = error, green = ok)
# but pulls every hue through the purple void.

# black  -- void / shadow
color0   #10160c
color8   #3f5427

# red  -- rose error
color1   #c05a3f
color9   #d97a5a

# green  -- mint success (otherworldly, not earthy)
color2   #6fbf73
color10  #8fd45c

# yellow  -- arcane gold
color3   #b8963f
color11  #d9c268

# blue  -- deep void blue (shifted purple-ward)
color4   #4f6f7a
color12  #7fa3ac

# magenta  -- fae / vivid purple (the heart of the palette)
color5   #3f7d3a
color13  #7fcf6a

# cyan  -- mist teal
color6   #7fb0a8
color14  #bcdfd8

# white  -- petal / silver
color7   #b9c2a8
color15  #f0efd8
