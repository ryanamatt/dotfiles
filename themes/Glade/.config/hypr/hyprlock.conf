# hyprlock.conf
#
# Palette:
#   hollow    #10160c    shadow    #2a3a1c
#   moss      #5f9142    fern      #3f7d3a
#   sunbeam   #d9c268    canvas    #f0efd8
#   mist      #8a9d76    brass     #c9a24a
#   rust      #c05a3f    kelp      #6fbf73
#
# shortcuts: ESC, Ctrl+U, Ctrl+Backspace -- clear password buffer

$font        = Iosevka Nerd Font Propo
$font_bold   = Iosevka Nerd Font Propo

# --- General ---
general {
    hide_cursor      = true
    grace            = 0
    no_fade_in       = false
    no_fade_out      = false
    ignore_empty_input = false
}

# --- Animations ---
animations {
    enabled = true

    bezier = voidRise,  0.23, 1,    0.32, 1      # easeOutQuint -- matches Hyprland
    bezier = voidFade,  0.5,  0.5,  0.75, 1      # almostLinear
    bezier = linear,    1,    1,    0,    0

    animation = fadeIn,           1, 6,  voidRise
    animation = fadeOut,          1, 4,  voidFade
    animation = inputFieldDots,   1, 3,  voidRise
    animation = inputFieldFade,   1, 4,  voidFade
    animation = inputFieldWidth,  1, 5,  voidRise
}

# --- Background ---
# Screenshot of the desktop, heavily blurred + darkened into the void
background {
    monitor =
    path         = screenshot
    blur_passes  = 4
    blur_size    = 8
    brightness   = 0.4
    contrast     = 0.9
    vibrancy     = 0.2
    vibrancy_darkness = 0.6
}

# --- Clock -- large, centered ---
label {
    monitor =
    text      = $TIME
    font_size = 96
    font_family = $font_bold
    color     = rgba(f0efd8ff)       # canvas

    shadow_passes = 3
    shadow_size   = 10
    shadow_color  = rgba(3f7d3a60)   # fern glow

    position = 0, 120
    halign   = center
    valign   = center
}

# --- Date ---
label {
    monitor =
    text      = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color     = rgba(5f9142ff)       # moss

    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(10160c80)

    position = 0, 52
    halign   = center
    valign   = center
}

# --- Flavor text -- arcane inscription above the input field ---
label {
    monitor =
    text      = ✦  speak the arcane word  ✦
    font_size = 13
    font_family = $font
    color     = rgba(8a9d76cc)       # mist, slightly transparent

    position = 0, -60
    halign   = center
    valign   = center
}

# --- Password input field ---
input-field {
    monitor =
    size             = 380, 52
    outline_thickness = 2
    rounding         = 12

    # Transparent fill -- blur behind shows through
    inner_color      = rgba(1b261280)

    # Idle border: moss → sunbeam gradient
    outer_color      = rgba(5f9142ff) rgba(d9c268ff) 45deg

    # Checking: brass pulse
    check_color      = rgba(c9a24aff) rgba(5f9142ff) 90deg

    # Fail: rose red
    fail_color       = rgba(c05a3fff) rgba(3f7d3aff) 40deg

    font_color       = rgba(f0efd8ff)  # canvas
    font_family      = $font

    fade_on_empty    = true
    placeholder_text = <i>passphrase...</i>
    fail_text        = <b>$PAMFAIL</b>
    check_text       = <i>divining...</i>

    dots_size        = 0.28
    dots_spacing     = 0.35
    dots_center      = true

    position = 0, -20
    halign   = center
    valign   = center
}

# --- User / avatar label ---
label {
    monitor =
    text      =  $USER
    font_size = 16
    font_family = $font
    color     = rgba(b8d17aff)       # bloom lavender

    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(10160c99)

    position = 0, 30
    halign   = center
    valign   = center
}

# --- Keyboard layout indicator ---
label {
    monitor =
    text    = $LAYOUT[en,ru]
    font_size = 14
    font_family = $font
    color   = rgba(8a9d7699)         # mist, dim

    onclick = hyprctl switchxkblayout all next

    position = 0, -90
    halign   = center
    valign   = center
}
