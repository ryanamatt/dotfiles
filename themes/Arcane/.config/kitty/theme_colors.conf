# --- 16-color terminal palette ---
# Arcane re-mapping: keeps semantic meaning (red = error, green = ok)
# but pulls every hue through the purple void.

# black  — void / shadow
color0   #0d0010
color8   #3b1f4a

# red  — rose error
color1   #e05c7a
color9   #f07090

# green  — mint success (otherworldly, not earthy)
color2   #5ecfa0
color10  #7de8b0

# yellow  — arcane gold
color3   #c8963a
color11  #f5c842

# blue  — deep void blue (shifted purple-ward)
color4   #5a7ab0
color12  #7da0d8

# magenta  — fae / vivid purple (the heart of the palette)
color5   #b00ea2
color13  #d966f5

# cyan  — mist teal
color6   #5ec8c8
color14  #9de8e8

# white  — petal / silver
color7   #c8b8d4
color15  #e8c5e9