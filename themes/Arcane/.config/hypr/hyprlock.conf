# hyprlock.conf
#
# Palette:
#   void      #0d0010    shadow    #2a0e3a
#   mallow    #ac74ad    magenta   #b00ea2
#   fae       #d966f5    petal     #e8c5e9
#   mist      #8a6f99    gold      #f5c842
#   red       #e05c7a    green     #5ecfa0
#
# shortcuts: ESC, Ctrl+U, Ctrl+Backspace -- clear password buffer

$font        = Iosevka Nerd Font Propo
$font_bold   = Iosevka Nerd Font Propo

# --- General ---
general {
    hide_cursor      = true
    grace            = 0
    no_fade_in       = false
    no_fade_out      = false
    ignore_empty_input = false
}

# --- Animations ---
animations {
    enabled = true

    bezier = voidRise,  0.23, 1,    0.32, 1      # easeOutQuint -- matches Hyprland
    bezier = voidFade,  0.5,  0.5,  0.75, 1      # almostLinear
    bezier = linear,    1,    1,    0,    0

    animation = fadeIn,           1, 6,  voidRise
    animation = fadeOut,          1, 4,  voidFade
    animation = inputFieldDots,   1, 3,  voidRise
    animation = inputFieldFade,   1, 4,  voidFade
    animation = inputFieldWidth,  1, 5,  voidRise
}

# --- Background ---
# Screenshot of the desktop, heavily blurred + darkened into the void
background {
    monitor =
    path         = screenshot
    blur_passes  = 4
    blur_size    = 8
    brightness   = 0.4          # darken toward the void
    contrast     = 0.9
    vibrancy     = 0.2          # let the purple bleed through
    vibrancy_darkness = 0.6
}

# --- Clock -- large, centered ---
label {
    monitor =
    text      = $TIME
    font_size = 96
    font_family = $font_bold
    color     = rgba(e8c5e9ff)       # petal

    shadow_passes = 3
    shadow_size   = 10
    shadow_color  = rgba(b00ea260)   # magenta glow

    position = 0, 120
    halign   = center
    valign   = center
}

# --- Date ---
label {
    monitor =
    text      = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color     = rgba(ac74adff)       # mallow

    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(0d001080)

    position = 0, 52
    halign   = center
    valign   = center
}

# --- Flavor text -- arcane inscription above the input field ---
label {
    monitor =
    text      = ✦  speak the arcane word  ✦
    font_size = 13
    font_family = $font
    color     = rgba(8a6f99cc)       # mist, slightly transparent

    position = 0, -60
    halign   = center
    valign   = center
}

# --- Password input field ---
input-field {
    monitor =
    size             = 380, 52
    outline_thickness = 2
    rounding         = 12

    # Transparent fill -- blur behind shows through
    inner_color      = rgba(1a002880)

    # Idle border: mallow → fae gradient
    outer_color      = rgba(ac74adff) rgba(d966f5ff) 45deg

    # Checking: gold pulse
    check_color      = rgba(f5c842ff) rgba(ac74adff) 90deg

    # Fail: rose red
    fail_color       = rgba(e05c7aff) rgba(b00ea2ff) 40deg

    font_color       = rgba(e8c5e9ff)  # petal
    font_family      = $font

    fade_on_empty    = true
    placeholder_text = <i>passphrase...</i>
    fail_text        = <b>$PAMFAIL</b>
    check_text       = <i>divining...</i>

    dots_size        = 0.28
    dots_spacing     = 0.35
    dots_center      = true

    position = 0, -20
    halign   = center
    valign   = center
}

# --- User / avatar label ---
label {
    monitor =
    text      =  $USER
    font_size = 16
    font_family = $font
    color     = rgba(c98fcaff)       # bloom lavender

    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(0d001099)

    position = 0, 30
    halign   = center
    valign   = center
}

# --- Keyboard layout indicator ---
label {
    monitor =
    text    = $LAYOUT[en,ru]
    font_size = 14
    font_family = $font
    color   = rgba(8a6f9999)         # mist, dim

    onclick = hyprctl switchxkblayout all next

    position = 0, -90
    halign   = center
    valign   = center
}