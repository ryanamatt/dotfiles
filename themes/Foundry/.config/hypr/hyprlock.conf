# hyprlock.conf
#
# Palette:
#   iron      #101411    shadow    #263328
#   copper    #9dae8f    pipe_orange #e65c36
#   blaze     #ff7b52    steel     #e8ecd8
#   mist      #879983    warning_yellow #e0b441
#   rust      #d94838    success_green #6fbf85
#
# shortcuts: ESC, Ctrl+U, Ctrl+Backspace -- clear password buffer

$font        = Iosevka Nerd Font Propo
$font_bold   = Iosevka Nerd Font Propo

# --- General ---
general {
    hide_cursor      = true
    grace            = 0
    no_fade_in       = false
    no_fade_out      = false
    ignore_empty_input = false
}

# --- Animations ---
animations {
    enabled = true

    bezier = voidRise,  0.23, 1,    0.32, 1      # easeOutQuint -- matches Hyprland
    bezier = voidFade,  0.5,  0.5,  0.75, 1      # almostLinear
    bezier = linear,    1,    1,    0,    0

    animation = fadeIn,           1, 6,  voidRise
    animation = fadeOut,          1, 4,  voidFade
    animation = inputFieldDots,   1, 3,  voidRise
    animation = inputFieldFade,   1, 4,  voidFade
    animation = inputFieldWidth,  1, 5,  voidRise
}

# --- Background ---
# Screenshot of the desktop, heavily blurred + darkened into the void
background {
    monitor =
    path         = screenshot
    blur_passes  = 4
    blur_size    = 8
    brightness   = 0.4
    contrast     = 0.9
    vibrancy     = 0.2
    vibrancy_darkness = 0.6
}

# --- Clock -- large, centered ---
label {
    monitor =
    text      = $TIME
    font_size = 96
    font_family = $font_bold
    color     = rgba(e8ecd8ff)       # steel

    shadow_passes = 3
    shadow_size   = 10
    shadow_color  = rgba(e65c3660)   # pipe_orange glow

    position = 0, 120
    halign   = center
    valign   = center
}

# --- Date ---
label {
    monitor =
    text      = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color     = rgba(9dae8fff)       # copper

    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(10141180)

    position = 0, 52
    halign   = center
    valign   = center
}

# --- Flavor text -- arcane inscription above the input field ---
label {
    monitor =
    text      = ✦  maintain system pressure  ✦
    font_size = 13
    font_family = $font
    color     = rgba(879983cc)       # mist, slightly transparent

    position = 0, -60
    halign   = center
    valign   = center
}

# --- Password input field ---
input-field {
    monitor =
    size             = 380, 52
    outline_thickness = 2
    rounding         = 12

    # Transparent fill -- blur behind shows through
    inner_color      = rgba(18201a80)

    # Idle border: copper → blaze gradient
    outer_color      = rgba(9dae8fff) rgba(ff7b52ff) 45deg

    # Checking: warning_yellow pulse
    check_color      = rgba(e0b441ff) rgba(9dae8fff) 90deg

    # Fail: rose red
    fail_color       = rgba(d94838ff) rgba(e65c36ff) 40deg

    font_color       = rgba(e8ecd8ff)  # steel
    font_family      = $font

    fade_on_empty    = true
    placeholder_text = <i>passphrase...</i>
    fail_text        = <b>$PAMFAIL</b>
    check_text       = <i>divining...</i>

    dots_size        = 0.28
    dots_spacing     = 0.35
    dots_center      = true

    position = 0, -20
    halign   = center
    valign   = center
}

# --- User / avatar label ---
label {
    monitor =
    text      =  $USER
    font_size = 16
    font_family = $font
    color     = rgba(c8d9beff)       # bloom lavender

    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(10141199)

    position = 0, 30
    halign   = center
    valign   = center
}

# --- Keyboard layout indicator ---
label {
    monitor =
    text    = $LAYOUT[en,ru]
    font_size = 14
    font_family = $font
    color   = rgba(87998399)         # mist, dim

    onclick = hyprctl switchxkblayout all next

    position = 0, -90
    halign   = center
    valign   = center
}
