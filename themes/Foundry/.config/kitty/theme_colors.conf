# --- 16-color terminal palette ---
# Foundry re-mapping: keeps semantic meaning (red = error, green = ok)
# but pulls every hue through the purple void.

# black  -- void / shadow
color0   #101411
color8   #374a3b

# red  -- rose error
color1   #d94838
color9   #ff6b5c

# green  -- mint success (otherworldly, not earthy)
color2   #6fbf85
color10  #7de8b0

# yellow  -- arcane gold
color3   #e0b441
color11  #f5cb5c

# blue  -- deep void blue (shifted purple-ward)
color4   #4ca6cf
color12  #70c2e8

# magenta  -- fae / vivid purple (the heart of the palette)
color5   #e65c36
color13  #ff7b52

# cyan  -- mist teal
color6   #6fc2cf
color14  #9de8ed

# white  -- petal / silver
color7   #b4bfc4
color15  #e8ecd8
