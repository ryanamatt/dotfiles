# Foundry Shell
#
# Requires: Nerd Fonts (any complete variant, e.g. JetBrainsMono Nerd Font)
# Install : Copy to ~/.config/starship.toml

# --- Prompt layout ---
# Line 1:  [glyph] [os]  [directory]  [git_branch] [git_status]
#          [language runtimes ...]
# Line 2:  [time]  [status/character]

format = """
$os\
$username\
$hostname\
[  ](fg:#374a3b)\
$directory\
[](fg:#374a3b bg:#263328)\
$git_branch\
$git_status\
[](fg:#263328 bg:none)\
$fill\
$python\
$nodejs\
$rust\
$golang\
$java\
$lua\
$package\
$cmd_duration\
$line_break\
$time\
$status\
$character"""

# --- Palette ---
palette = "Foundry"

[palettes.Foundry]
iron        = "#101411"
deep        = "#18201a"
shadow      = "#263328"
dusk        = "#374a3b"
copper      = "#9dae8f"
khaki       = "#c8d9be"
steel       = "#e8ecd8"
pipe_orange     = "#e65c36"
blaze         = "#ff7b52" 
warning_yellow        = "#e0b441"
silver      = "#b4bfc4"
mist        = "#879983"
rust         = "#d94838"      # error rose
green       = "#7de8b0"      # success mint (otherworldly, not typical green)
cable_blue        = "#4ca6cf" 

# --- OS / entry glyph ---
[os]
format = "[$symbol]($style) "
style = "bold fg:pipe_orange"
disabled = false

[os.symbols]
Arch        = "󰣇"
Unknown     = "󰬯"

# --- Username ---
[username]
format = "[$user]($style)"
style_user = "bold fg:khaki"
style_root = "bold fg:rust"
show_always = false

# --- Hostname ---
[hostname]
format = "[@$hostname]($style) "
style = "fg:mist"
ssh_only = true

# --- Directory ---
[directory]
format = "[ 󰱾 $path ]($style)[$read_only]($read_only_style)"
style = "bold fg:steel bg:#374a3b"
read_only = " 󰌾 "
read_only_style = "fg:rust bg:#374a3b"
truncation_length = 4
truncation_symbol = "󰇘 "
home_symbol = "󱂵 ~"

[directory.substitutions]
"Documents" = "󰈙 Docs"
"Downloads" = " DL"
"Music"     = "󰝚 Music"
"Pictures"  = "󰋩 Pics"
"Videos"    = "󰕧 Vids"
"Desktop"   = "󰟀 Desktop"
".config"   = "󱁿 cfg"
".local"    = "󰮂 local"
"src"       = "󰅩 src"
"projects"  = "󰏗 projects"

# --- Git Branch ---
[git_branch]
format = "[ $symbol$branch(:$remote_branch) ]($style)"
symbol = "󰘬 "
style = "bold fg:blaze bg:#263328"
truncation_length = 24
truncation_symbol = "󰇘"

# --- Git Status ---
[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "fg:warning_yellow bg:#263328"
conflicted  = " 󱗃 "
ahead       = " ⇡${count}"
behind      = " ⇣${count}"
diverged    = " 󰹺 ⇡${ahead_count}⇣${behind_count}"
untracked   = " 󰐗${count}"
stashed     = " 󰏗 "
modified    = " 󰝶${count}"
staged      = " 󰸞${count}"
renamed     = " 󰑕${count}"
deleted     = " 󰩺${count}"

# --- Fill (right-align runtimes) ---
[fill]
symbol = " "
style = "fg:iron"

# --- Language runtimes ---
[python]
format = "[ $symbol$version ]($style)"
symbol = "󰌠 "
style = "fg:copper"
version_format = "v${major}.${minor}"

[nodejs]
format = "[ $symbol$version ]($style)"
symbol = " "
style = "fg:green"
version_format = "v${major}.${minor}"

[rust]
format = "[ $symbol$version ]($style)"
symbol = "󱘗 "
style = "fg:khaki"
version_format = "v${major}.${minor}"

[golang]
format = "[ $symbol$version ]($style)"
symbol = "󰟓 "
style = "fg:cable_blue"
version_format = "v${major}.${minor}"

[java]
format = "[ $symbol$version ]($style)"
symbol = "󰬷 "
style = "fg:warning_yellow"
version_format = "v${major}.${minor}"

[lua]
format = "[ $symbol$version ]($style)"
symbol = "󰢱 "
style = "fg:copper"
version_format = "v${major}.${minor}"

[package]
format = "[ 󰏗 $version ]($style)"
style = "fg:silver"
version_format = "v${raw}"

# --- Command duration ---
[cmd_duration]
format = "[ 󱞩 $duration ]($style)"
style = "fg:mist"
min_time = 2_000
show_milliseconds = false

# --- Time (second line, left) ---
[time]
format = "[󱑃 $time ]($style)"
style = "fg:mist"
time_format = "%H:%M"
disabled = false

# --- Exit status ---
[status]
format = "[$symbol$status ]($style)"
symbol = " "
success_symbol = ""
not_executable_symbol = "󰌾 "
not_found_symbol = "󰩺 "
sigint_symbol = "󰆐 "
style = "bold fg:rust"
map_symbol = true
disabled = false

# --- Prompt character ---
[character]
format = "$symbol "
success_symbol = "[⚙](bold fg:pipe_orange)"
error_symbol   = "[⚠](bold fg:rust)"
vimcmd_symbol  = "[󰣘](bold fg:blaze)"
