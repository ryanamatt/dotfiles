# --- 16-color terminal palette ---
# Grotto re-mapping: keeps semantic meaning (red = error, green = ok)
# but pulls every hue through the mossy grotto dark.

# black  — hollow / dusk
color0   #0a1512
color8   #2f5245

# red  — coral error
color1   #d9506f
color9   #f0748c

# green  — leaf success (earthy fern, not otherworldly)
color2   #6ea86a
color10  #8fd08c

# yellow  — grotto gold
color3   #c69a3c
color11  #e8b84b

# blue  — pool water blue (shifted green-ward)
color4   #4f8ca8
color12  #7db4d0

# magenta  — blossom / orchid (the heart of the palette)
color5   #d1467e
color13  #ff74ab

# cyan  — spray teal
color6   #7fc0ba
color14  #c8ece8

# white  — foam / silver
color7   #b9c9bf
color15  #eaf5ec