# hyprlock.conf
#
# Palette:
#   hollow    #0a1512    shade     #1e3a30
#   petal     #c97a97    blossom   #d1467e
#   orchid    #ff74ab    foam      #eaf5ec
#   haze      #7fa08f    gold      #e8b84b
#   coral     #d9506f    leaf      #6ea86a
#
# shortcuts: ESC, Ctrl+U, Ctrl+Backspace -- clear password buffer

$font        = Iosevka Nerd Font Propo
$font_bold   = Iosevka Nerd Font Propo

# --- General ---
general {
    hide_cursor      = true
    grace            = 0
    no_fade_in       = false
    no_fade_out      = false
    ignore_empty_input = false
}

# --- Animations ---
animations {
    enabled = true

    bezier = hollowRise,  0.23, 1,    0.32, 1      # easeOutQuint -- matches Hyprland
    bezier = hollowFade,  0.5,  0.5,  0.75, 1      # almostLinear
    bezier = linear,      1,    1,    0,    0

    animation = fadeIn,           1, 6,  hollowRise
    animation = fadeOut,          1, 4,  hollowFade
    animation = inputFieldDots,   1, 3,  hollowRise
    animation = inputFieldFade,   1, 4,  hollowFade
    animation = inputFieldWidth,  1, 5,  hollowRise
}

# --- Background ---
# Screenshot of the desktop, heavily blurred + darkened into the hollow
background {
    monitor =
    path         = screenshot
    blur_passes  = 4
    blur_size    = 8
    brightness   = 0.4          # darken toward the hollow
    contrast     = 0.9
    vibrancy     = 0.2          # let the grotto green-black bleed through
    vibrancy_darkness = 0.6
}

# --- Clock -- large, centered ---
label {
    monitor =
    text      = $TIME
    font_size = 96
    font_family = $font_bold
    color     = rgba(eaf5ecff)       # foam

    shadow_passes = 3
    shadow_size   = 10
    shadow_color  = rgba(d1467e60)   # blossom glow

    position = 0, 120
    halign   = center
    valign   = center
}

# --- Date ---
label {
    monitor =
    text      = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color     = rgba(c97a97ff)       # petal

    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(0a151280)

    position = 0, 52
    halign   = center
    valign   = center
}

# --- Flavor text -- grotto inscription above the input field ---
label {
    monitor =
    text      = ✦  the grotto keeps its secrets  ✦
    font_size = 13
    font_family = $font
    color     = rgba(7fa08fcc)       # haze, slightly transparent

    position = 0, -60
    halign   = center
    valign   = center
}

# --- Password input field ---
input-field {
    monitor =
    size             = 380, 52
    outline_thickness = 2
    rounding         = 12

    # Transparent fill -- blur behind shows through
    inner_color      = rgba(12262080)

    # Idle border: petal → orchid gradient
    outer_color      = rgba(c97a97ff) rgba(ff74abff) 45deg

    # Checking: gold pulse
    check_color      = rgba(e8b84bff) rgba(c97a97ff) 90deg

    # Fail: coral red
    fail_color       = rgba(d9506fff) rgba(d1467eff) 40deg

    font_color       = rgba(eaf5ecff)  # foam
    font_family      = $font

    fade_on_empty    = true
    placeholder_text = <i>passphrase...</i>
    fail_text        = <b>$PAMFAIL</b>
    check_text       = <i>flowing...</i>

    dots_size        = 0.28
    dots_spacing     = 0.35
    dots_center      = true

    position = 0, -20
    halign   = center
    valign   = center
}

# --- User / avatar label ---
label {
    monitor =
    text      =  $USER
    font_size = 16
    font_family = $font
    color     = rgba(e3aec8ff)       # bloom pink

    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(0a151299)

    position = 0, 30
    halign   = center
    valign   = center
}

# --- Keyboard layout indicator ---
label {
    monitor =
    text    = $LAYOUT[en,ru]
    font_size = 14
    font_family = $font
    color   = rgba(7fa08f99)         # haze, dim

    onclick = hyprctl switchxkblayout all next

    position = 0, -90
    halign   = center
    valign   = center
}