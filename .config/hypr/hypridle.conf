# hypridle.conf
#
# Idle chain:
#   15 min    → lock screen (hyprlock)
#   15.5 min  → turn off displays (dpms off)
#   30 min   → suspend
#
# On unlock/resume: restore brightness + turn displays back on

general {
    lock_cmd         = pidof hyprlock || hyprlock   # don't spawn a second hyprlock if already running
    before_sleep_cmd = loginctl lock-session         # lock before suspend
    after_sleep_cmd  = hyprctl dispatch dpms on      # wake displays after resume
    ignore_dbus_inhibit = false                      # respect apps that block idle (e.g. video players)
}

# --- 15 min: lock the screen ---
listener {
    timeout  = 900
    on-timeout = loginctl lock-session
}

# --- 15 min 30 sec: turn displays off ---
# Slightly after locking so hyprlock has time to render
listener {
    timeout  = 930

    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# --- 30 min: suspend ---
listener {
    timeout  = 1800
    on-timeout = systemctl suspend
}