name: Windward
slug: Windward

concept: >
  A maritime / open-ocean aesthetic built around the colors of a tall
  ship cutting through deep water under a bright sky -- extended into
  a full cohesive palette.

feeling: >
  Standing at the rail of a clipper ship mid-voyage -- deep teal-black
  water below, sun-bleached canvas sails overhead, a wide pale sky,
  brass fittings gone warm with salt air, and the rust-red warning of
  a hull that's seen weather. Foam breaks white against the bow.
  Distant coastline fades to olive-grey on the horizon. A world in
  motion, always heading somewhere.

# ---------------------------------------------------------------------------
# RAW PALETTE
# ---------------------------------------------------------------------------
palette:
  abyss:       { hex: "#0a1a1d", role: "Primary background" }
  deep:        { hex: "#123338", role: "Alt background / surfaces" }
  shadow:      { hex: "#1e4b4f", role: "Segment midtone / borders" }
  dusk:        { hex: "#2d6b66", role: "Hover states / inactive" }
  mist:        { hex: "#7fa89f", role: "Dimmed text / secondary" }
  foam:        { hex: "#4fa88f", role: "Cursor / accent" }
  sky:         { hex: "#8fc4d9", role: "Lighter sky-blue" }
  canvas:      { hex: "#ede3c8", role: "Primary foreground / text" }
  teal:        { hex: "#1f7a6c", role: "Active / border" }
  dark_blue:   { hex: "#1e3e70", role: "Inactive / border (dedicated Hyprland-inactive swatch -- distinct from the general `shadow` alt-surface)" }
  aqua:        { hex: "#5fd9c4", role: "Bright accent / highlights" }
  brass:       { hex: "#c9a24a", role: "Operators / warnings / trim" }
  silver:      { hex: "#b8c4c0", role: "Muted text" }
  kelp:        { hex: "#6fbf73", role: "Success / ok states" }
  cyan:        { hex: "#a8d8e0", role: "Escape sequences / info" }
  rust:        { hex: "#c9603f", role: "Errors / critical / urgent" }
  ember:       { hex: "#d9884a", role: "Warm shift (sun-warmed wood)" }
  mid_shadow:  { hex: "#183f44", role: "Mid shadow -- swaync alt widget bg / notification bg" }
  grey1:       { hex: "#568a82", role: "Grey step between mist and dusk" }
  bright_green: { hex: "#8fe093", role: "Starship-only bright mint (= ANSI bright_green)" }

extra:
  autosuggestions: "#234d47"
  mist_text:     { hex: "#9dbdb5", role: "Muted/secondary text (lifted mist)" }
  border_soft:   { hex: "#2a4f4f", role: "Inactive borders, hr, dividers" }
  border_strong: { hex: "#3a6863", role: "Hover / visible borders" }

# ---------------------------------------------------------------------------
# SEMANTIC ROLES
# ---------------------------------------------------------------------------
semantic:
  background:             abyss
  surface:                deep
  alt_surface:            shadow

  active_border:          teal
  border_inactive_soft:   border_soft
  border_hover_strong:    border_strong
  
  hypr_border_active:     teal
  hypr_border_inactive:   dark_blue
  hypr_shadow:            teal

  text_primary:           canvas
  text_secondary:         mist
  cursor:                 foam
  fish_commands:          aqua
  fish_keywords:          foam
  fish_strings:           sky
  fish_comments:          dusk

  operators:              brass
  escape_sequences:       cyan
  autosuggestions:        autosuggestions
  success:                kelp
  warning:                brass
  error:                  rust

  hover:                  dusk
  selected:               teal
  url:                    aqua

  reading_text_secondary: mist_text

  info:                   cyan
  surface_mid:            mid_shadow
  muted_text:             silver
  ember_warm:             ember
  starship_green:         bright_green

glow:
  color: teal
  alpha: 0.25

ansi:
  - { index: 0,  name: black,          hex: "#0a1a1d" }
  - { index: 1,  name: red,            hex: "#c9603f" }
  - { index: 2,  name: green,          hex: "#6fbf73" }
  - { index: 3,  name: yellow,         hex: "#b3923f" }
  - { index: 4,  name: blue,           hex: "#4f83a8" }
  - { index: 5,  name: magenta,        hex: "#1f7a6c" }
  - { index: 6,  name: cyan,           hex: "#6fb8b0" }
  - { index: 7,  name: white,          hex: "#b8c4c0" }
  - { index: 8,  name: bright_black,   hex: "#2d6b66" }
  - { index: 9,  name: bright_red,     hex: "#e08066" }
  - { index: 10, name: bright_green,   hex: "#8fe093" }
  - { index: 11, name: bright_yellow,  hex: "#c9a24a" }
  - { index: 12, name: bright_blue,    hex: "#7da8c9" }
  - { index: 13, name: bright_magenta, hex: "#5fd9c4" }
  - { index: 14, name: bright_cyan,    hex: "#a8d8e0" }
  - { index: 15, name: bright_white,   hex: "#ede3c8" }

transparency:
  swaync_center:     { alpha: 0.92 }
  hyprlock_bg:       { brightness: 0.40, blur_passes: 4, blur_size: 8 }

typography:
  hyprlock:  "Iosevka Nerd Font Propo"

borders:
  kitty:             { active: teal, inactive: dusk }

text:
  hyprlock_text: "state your bearings"

glyphs:
  prompt_success: "⚓"
  prompt_error:   "⛈"
  vim_normal:     "⛵"
  git_branch:     "󰘬"
  dir_prefix:     "🧭"
  home:           "󱂵"
  flavor_star:    "✦"
  os:             "󰣇"

fastfetch_logo: ship.txt

notes:
  readability: >
    Raw mist/dusk/shadow/teal/abyss read fine on a terminal bar or
    status line, but get muddy or tiring as body text / long borders /
    anything read continuously. Use the derived tones (parchment,
    mist_text, border_soft, border_strong, teal_accent, link_heading)
    for those surfaces instead.
  rules:
    - "pure black (#000000) and pure white (#ffffff) are never used"
    - "darkest point is abyss #0a1a1d, lightest is canvas #ede3c8"
    - "every color has a teal/sea undertone, even golds and reds lean cool"
