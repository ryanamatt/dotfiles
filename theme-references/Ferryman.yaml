name: Ferryman
slug: Ferryman

concept: >
  A death-and-water aesthetic built around a hooded reaper poling a
  boat through frozen marsh mist, one lantern the only warm thing for
  miles.

feeling: >
  The crossing itself -- a cold, ink-blue void of fog and reeds, a
  silhouette darker than the night around it, and a single amber
  lantern swinging at the prow, throwing everything it touches into
  gold. Runes still glow like old gold under frost. Ice-pale
  breath-fog drifts at the waterline. Somewhere behind the mist, the
  far shore.

# ---------------------------------------------------------------------------
# RAW PALETTE
# ---------------------------------------------------------------------------
palette:
  styx:        { hex: "#050a10", role: "Primary background" }
  deep:        { hex: "#0d1b2b", role: "Alt background / surfaces" }
  shadow:      { hex: "#16293d", role: "Segment midtone / borders" }
  dusk:        { hex: "#1f3c54", role: "Hover states / inactive" }
  mist:        { hex: "#7e93a8", role: "Dimmed text / secondary" }
  wisp:        { hex: "#5a7a94", role: "Cursor / accent" }
  frost:       { hex: "#a8c8d9", role: "Lighter fog-blue" }
  pale:        { hex: "#dceaf2", role: "Primary foreground / text" }
  lantern:     { hex: "#f2a83c", role: "Active / border" }
  dark_blue:   { hex: "#142035", role: "Inactive / border (dedicated Hyprland-inactive swatch -- distinct from the general `shadow` alt-surface)" }
  flame:       { hex: "#ffcf6b", role: "Bright accent / highlights" }
  rune:        { hex: "#f5c842", role: "Operators / warnings / runes" }
  silver:      { hex: "#b8c4cc", role: "Muted text" }
  wraith:      { hex: "#5ecf9a", role: "Success / ok states" }
  rime:        { hex: "#8fd9e0", role: "Escape sequences / info" }
  blood:       { hex: "#c9455a", role: "Errors / critical / urgent" }
  cinder:      { hex: "#d97a4a", role: "Ember (shifted warm)" }
  mid_shadow:  { hex: "#122234", role: "Mid shadow -- swaync alt widget bg / notification bg" }
  grey1:       { hex: "#4e687e", role: "Grey step between mist and dusk" }
  bright_green: { hex: "#7de0b0", role: "Starship-only bright mint (= ANSI bright_green)" }

extra:
  autosuggestions: "#253d52"
  mist_text:     { hex: "#93a8ba", role: "Muted/secondary text (lifted mist)" }
  border_soft:   { hex: "#2a3f52", role: "Inactive borders, hr, dividers" }
  border_strong: { hex: "#3d5870", role: "Hover / visible borders" }

# ---------------------------------------------------------------------------
# SEMANTIC ROLES -- templates reference these, never raw palette names.
# ---------------------------------------------------------------------------
semantic:
  background:             styx
  surface:                deep
  alt_surface:            shadow

  active_border:          lantern
  border_inactive_soft:   border_soft
  border_hover_strong:    border_strong

  hypr_border_active:     lantern
  hypr_border_inactive:   dark_blue
  hypr_shadow:            lantern
  
  text_primary:           pale
  text_secondary:         mist
  cursor:                 wisp
  fish_commands:          flame
  fish_keywords:          wisp
  fish_strings:           frost
  fish_comments:          dusk
  
  operators:              rune
  escape_sequences:       rime
  autosuggestions:        autosuggestions
  success:                wraith
  warning:                rune
  error:                  blood
  
  hover:                  dusk
  selected:               lantern
  url:                    flame
  
  reading_text_secondary: mist_text

  info:                   rime
  surface_mid:            mid_shadow
  muted_text:             silver
  ember_warm:             cinder
  starship_green:         bright_green


glow:
  color: lantern
  alpha: 0.25

ansi:
  - { index: 0,  name: black,          hex: "#050a10" }
  - { index: 1,  name: red,            hex: "#c9455a" }
  - { index: 2,  name: green,          hex: "#5ecf9a" }
  - { index: 3,  name: yellow,         hex: "#b3923a" }
  - { index: 4,  name: blue,           hex: "#4a6f94" }
  - { index: 5,  name: magenta,        hex: "#f2a83c" }
  - { index: 6,  name: cyan,           hex: "#6fb8c4" }
  - { index: 7,  name: white,          hex: "#b8c4cc" }
  - { index: 8,  name: bright_black,   hex: "#1f3c54" }
  - { index: 9,  name: bright_red,     hex: "#de6b7a" }
  - { index: 10, name: bright_green,   hex: "#7de0b0" }
  - { index: 11, name: bright_yellow,  hex: "#f5c842" }
  - { index: 12, name: bright_blue,    hex: "#7fa8cc" }
  - { index: 13, name: bright_magenta, hex: "#ffcf6b" }
  - { index: 14, name: bright_cyan,    hex: "#a8e8ec" }
  - { index: 15, name: bright_white,   hex: "#dceaf2" }

transparency:
  swaync_center:     { alpha: 0.92 }
  hyprlock_bg:       { brightness: 0.40, blur_passes: 4, blur_size: 8 }

typography:
  hyprlock:  "Iosevka Nerd Font Propo"

borders:
  kitty:             { active: lantern, inactive: dusk }

glyphs:
  prompt_success: "⚱"
  prompt_error:   "☠"
  vim_normal:     "⛧"
  git_branch:     "󰘬"
  dir_prefix:     "🕯"
  home:           "󱂵"
  flavor_star:    "✦"
  os:             "󰣇"

fastfetch_logo: scythe.txt

notes:
  readability: >
    Raw mist/dusk/shadow/lantern/styx read fine on a terminal bar or
    status line, but get muddy or tiring as body text / long borders /
    anything read continuously. Use the derived tones (hollow, mist_text,
    border_soft, border_strong, lantern_accent, link_heading) for those
    surfaces instead.
  rules:
    - "pure black (#000000) and pure white (#ffffff) are never used"
    - "darkest point is styx #050a10, lightest is pale #dceaf2"
    - "every color has a cold blue undertone, even the amber lantern"
