name: Vantage
slug: Vantage          # used for dir names, wallpaper folder, etc.

concept: >
  A quiet-bedroom-window aesthetic built around watching fireworks
  bloom over a snowbound mountain valley -- string lights, a warm mug,
  and a laptop glow the only warmth in a cold, deep-blue night.

feeling: >
  Curled up on the sill with headphones on and a mug going cold in
  your hands, the room behind you dark except for a strand of red
  fairy lights and the laptop's soft glow. Out the window the whole
  valley is snow and scattered gold townlight, and above it fireworks
  keep opening in magenta and fuchsia against a deep starred sky.
  Nothing to do but watch it burn out slow.

# ---------------------------------------------------------------------------
# RAW PALETTE -- every named color, its hex, and a small note about its usage.
# ---------------------------------------------------------------------------
palette:
  night:       { hex: "#080c18", role: "Primary background" }
  deep:        { hex: "#0f1830", role: "Alt background / surfaces" }
  shadow:      { hex: "#182644", role: "Segment midtone / borders" }
  dusk:        { hex: "#283c60", role: "Hover states / inactive" }
  mist:        { hex: "#7e93b5", role: "Dimmed text / secondary" }
  spark:       { hex: "#d94f9e", role: "Cursor / accent" }
  frost:       { hex: "#8fc4e0", role: "Lighter fog/sky-blue" }
  snow:        { hex: "#eef2f5", role: "Primary foreground / text" }
  bloom:       { hex: "#e0479e", role: "Active / border" }
  navy:        { hex: "#14203c", role: "Inactive / border (dedicated Hyprland-inactive swatch -- distinct from the general `shadow` alt-surface)" }
  fuchsia:     { hex: "#ff6ec7", role: "Bright accent / highlights" }
  amber:       { hex: "#e8a23c", role: "Operators / warnings / string-light trim" }
  silver:      { hex: "#a9b8cc", role: "Muted text" }
  mint:        { hex: "#5ecf9a", role: "Success / ok states" }
  ice:         { hex: "#8fd4e0", role: "Escape sequences / info" }
  scarlet:     { hex: "#d9484f", role: "Errors / critical / urgent" }
  ember:       { hex: "#d97a3c", role: "Warm shift (fairy-light ember)" }
  mid_shadow:  { hex: "#16223e", role: "Mid shadow -- swaync alt widget bg / notification bg" }
  grey1:       { hex: "#4e6080", role: "Grey step between mist and dusk" }
  bright_green: { hex: "#7de8b0", role: "Starship-only bright mint (= ANSI bright_green)" }

# one-off colors that don't fit the named-swatch pattern
extra:
  autosuggestions: "#1c2c4c"
  mist_text:     { hex: "#93a8c4", role: "Muted/secondary text (lifted mist)" }
  border_soft:   { hex: "#223454", role: "Inactive borders, hr, dividers" }
  border_strong: { hex: "#3a5476", role: "Hover / visible borders" }

# ---------------------------------------------------------------------------
# SEMANTIC ROLES -- every generator/template should reference THESE keys,
# never raw palette names directly. Values are palette/derived/extra keys,
# NOT hex codes, so re-theming = editing palette/derived above only.
# ---------------------------------------------------------------------------
semantic:
  background:             night
  surface:                deep
  alt_surface:            shadow

  active_border:          bloom
  border_inactive_soft:   border_soft
  border_hover_strong:    border_strong

  hypr_border_active:     bloom
  hypr_border_inactive:   navy
  hypr_shadow:            bloom

  text_primary:           snow
  text_secondary:         mist
  cursor:                 spark
  fish_commands:          fuchsia
  fish_keywords:          spark
  fish_strings:           frost
  fish_comments:          dusk

  operators:              amber
  escape_sequences:       ice
  autosuggestions:        autosuggestions
  success:                mint
  warning:                amber
  error:                  scarlet

  hover:                  dusk
  selected:               bloom
  url:                    fuchsia

  reading_text_secondary: mist_text

  info:                   ice
  surface_mid:            mid_shadow
  muted_text:             silver
  ember_warm:             ember
  starship_green:         bright_green

glow:
  color: bloom
  alpha: 0.25

# ---------------------------------------------------------------------------
# ANSI 16-color terminal palette
# ---------------------------------------------------------------------------
ansi:
  - { index: 0,  name: black,          hex: "#080c18" }
  - { index: 1,  name: red,            hex: "#d9484f" }
  - { index: 2,  name: green,          hex: "#5ecf9a" }
  - { index: 3,  name: yellow,         hex: "#c9963c" }
  - { index: 4,  name: blue,           hex: "#4a6fa0" }
  - { index: 5,  name: magenta,        hex: "#e0479e" }
  - { index: 6,  name: cyan,           hex: "#6fc0c8" }
  - { index: 7,  name: white,          hex: "#a9b8cc" }
  - { index: 8,  name: bright_black,   hex: "#283c60" }
  - { index: 9,  name: bright_red,     hex: "#f0707a" }
  - { index: 10, name: bright_green,   hex: "#7de8b0" }
  - { index: 11, name: bright_yellow,  hex: "#e8a23c" }
  - { index: 12, name: bright_blue,    hex: "#7fa8d8" }
  - { index: 13, name: bright_magenta, hex: "#ff6ec7" }
  - { index: 14, name: bright_cyan,    hex: "#a8e8ec" }
  - { index: 15, name: bright_white,   hex: "#eef2f5" }

# ---------------------------------------------------------------------------
# Transparency & blur
# ---------------------------------------------------------------------------
transparency:
  swaync_center:     { alpha: 0.92 }
  hyprlock_bg:       { brightness: 0.40, blur_passes: 4, blur_size: 8 }

# ---------------------------------------------------------------------------
# Typography
# ---------------------------------------------------------------------------
typography:
  hyprlock:  "Iosevka Nerd Font Propo"

# ---------------------------------------------------------------------------
# Borders & rounding
# ---------------------------------------------------------------------------
borders:
  kitty:             { active: bloom, inactive: dusk }

text:
  hyprlock_text: "watch the sky burn slow"

# ---------------------------------------------------------------------------
# Key glyphs (Nerd Font)
# ---------------------------------------------------------------------------
glyphs:
  prompt_success: "🎆"
  prompt_error:   "❄"
  vim_normal:     "🪟"
  git_branch:     "󰘬"
  dir_prefix:     "🛏"
  home:           "󱂵"
  flavor_star:    "✦"
  os:             "󰣇"

fastfetch_logo: firework.txt

# ---------------------------------------------------------------------------
# Freeform notes about anything needing extra comments.
# ---------------------------------------------------------------------------
notes:
  readability: >
    Raw mist/dusk/shadow/bloom/night read fine on a terminal bar or
    status line, but get muddy or tiring as body text / long borders /
    anything read continuously. Use the derived tones (mist_text,
    border_soft, border_strong, bloom_accent, link_heading) for those
    surfaces instead.
  rules:
    - "pure black (#000000) and pure white (#ffffff) are never used"
    - "darkest point is night #080c18, lightest is snow #eef2f5"
    - "every color has a cold night-blue undertone, even amber and scarlet lean cool at the edges"