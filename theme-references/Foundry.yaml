name: Foundry
slug: Foundry          # used for dir names, wallpaper folder, etc.

concept: >
  A retro-futuristic industrial machinery aesthetic built around the Pipes wallpaper in wallpapers/Pipes[cite: 1].

feeling: >
  Deep inside a massive automated factory complex -- towering walls of weathered
  olive-green steel plates, massive orange pressure pipes crisscrossing overhead,
  giant circular reservoirs stamped with white numbers, and thin blue control
  cables threading through the shadows. The air smells of ozone and warm oil.
  Industrial hums echo in the vast metallic cavern.

# ---------------------------------------------------------------------------
# RAW PALETTE -- every named color, its hex, and a small note about its usage.
# ---------------------------------------------------------------------------
palette:
  iron:        { hex: "#101411", role: "Primary background" }
  deep:        { hex: "#18201a", role: "Alt background / surfaces" }
  shadow:      { hex: "#263328", role: "Segment midtone / borders" }
  dusk:        { hex: "#374a3b", role: "Hover states / inactive" }
  mist:        { hex: "#879983", role: "Dimmed text / secondary" }
  copper:      { hex: "#9dae8f", role: "Cursor / accent" }
  khaki:       { hex: "#c8d9be", role: "Lighter industrial green-grey" }
  steel:       { hex: "#e8ecd8", role: "Primary foreground / text" }
  pipe_orange: { hex: "#e65c36", role: "Active / border (bright orange pipes)" }
  dark_iron:   { hex: "#202a22", role: "Inactive / border" }
  blaze:       { hex: "#ff7b52", role: "Bright accent / highlights" }
  warning_yellow: { hex: "#e0b441", role: "Operators / warnings" }
  silver:      { hex: "#b4bfc4", role: "Muted text" }
  success_green: { hex: "#6fbf85", role: "Success / ok states" }
  cable_blue:  { hex: "#4ca6cf", role: "Escape sequences / info (blue control cables)" }
  rust:        { hex: "#d94838", role: "Errors / critical / urgent" }
  ember:       { hex: "#d9824a", role: "Ember (shifted warm)" }
  mid_shadow:  { hex: "#1d261f", role: "Mid shadow -- swaync alt widget bg / notification bg" }
  grey1:       { hex: "#546b50", role: "Grey step between mist and dusk" }
  bright_green: { hex: "#7de8b0", role: "Starship-only bright green (= ANSI bright_green)" }

# one-off colors that don't fit the named-swatch pattern
extra:
  autosuggestions: "#314234"
  mist_text:     { hex: "#a3b39e", role: "Muted/secondary text (lifted mist)" }
  border_soft:   { hex: "#304033", role: "Inactive borders, hr, dividers" }
  border_strong: { hex: "#4a634e", role: "Hover / visible borders" }

# ---------------------------------------------------------------------------
# SEMANTIC ROLES -- every generator/template should reference THESE keys,
# never raw palette names directly. Values are palette/derived/extra keys,
# NOT hex codes, so re-theming = editing palette/derived above only.
# ---------------------------------------------------------------------------
semantic:
  background:            iron
  surface:               deep
  alt_surface:           shadow

  active_border:         pipe_orange
  border_inactive_soft:  border_soft
  border_hover_strong:   border_strong

  hypr_border_active:    pipe_orange
  hypr_border_inactive:  dark_iron
  hypr_shadow:           pipe_orange

  text_primary:          steel
  text_secondary:        mist
  cursor:                copper
  fish_commands:         blaze
  fish_keywords:         copper
  fish_strings:          khaki
  fish_comments:         dusk
  
  operators:             warning_yellow
  escape_sequences:      cable_blue
  autosuggestions:       autosuggestions
  success:               success_green
  warning:               warning_yellow
  error:                 rust
  
  hover:                 dusk
  selected:              pipe_orange
  url:                   blaze
  
  reading_text_secondary: mist_text

  info:                  cable_blue
  surface_mid:           mid_shadow
  muted_text:            silver
  ember_warm:            ember
  starship_green:        bright_green

glow:
  color: pipe_orange
  alpha: 0.25

# ---------------------------------------------------------------------------
# ANSI 16-color terminal palette
# ---------------------------------------------------------------------------
ansi:
  - { index: 0,  name: black,          hex: "#101411" }
  - { index: 1,  name: red,            hex: "#d94838" }
  - { index: 2,  name: green,          hex: "#6fbf85" }
  - { index: 3,  name: yellow,         hex: "#e0b441" }
  - { index: 4,  name: blue,           hex: "#4ca6cf" }
  - { index: 5,  name: magenta,        hex: "#e65c36" }
  - { index: 6,  name: cyan,           hex: "#6fc2cf" }
  - { index: 7,  name: white,          hex: "#b4bfc4" }
  - { index: 8,  name: bright_black,   hex: "#374a3b" }
  - { index: 9,  name: bright_red,     hex: "#ff6b5c" }
  - { index: 10, name: bright_green,   hex: "#7de8b0" }
  - { index: 11, name: bright_yellow,  hex: "#f5cb5c" }
  - { index: 12, name: bright_blue,    hex: "#70c2e8" }
  - { index: 13, name: bright_magenta, hex: "#ff7b52" }
  - { index: 14, name: bright_cyan,    hex: "#9de8ed" }
  - { index: 15, name: bright_white,   hex: "#e8ecd8" }

# ---------------------------------------------------------------------------
# Transparency & blur
# ---------------------------------------------------------------------------
transparency:
  swaync_center:     { alpha: 0.92 }
  hyprlock_bg:       { brightness: 0.40, blur_passes: 4, blur_size: 8 }

# ---------------------------------------------------------------------------
# Typography
# ---------------------------------------------------------------------------
typography:
  hyprlock:  "Iosevka Nerd Font Propo"

# ---------------------------------------------------------------------------
# Borders & rounding
# ---------------------------------------------------------------------------
borders:
  kitty:             { active: pipe_orange, inactive: dusk }

text:
  hyprlock_text: "maintain system pressure"

# ---------------------------------------------------------------------------
# Key glyphs (Nerd Font)
# ---------------------------------------------------------------------------
glyphs:
  prompt_success: "⚙"
  prompt_error:   "⚠"
  vim_normal:     "󰣘"
  git_branch:     "󰘬"
  dir_prefix:     "󰱾"
  home:           "󱂵"
  flavor_star:    "✦"
  os:             "󰣇"

fastfetch_logo: pipe.txt

# ---------------------------------------------------------------------------
# Freeform notes about anything needing extra comments.
# ---------------------------------------------------------------------------
notes:
  readability: >
    Raw mist/dusk/shadow/pipe_orange/iron read fine on a terminal bar or
    status line, but get muddy or tiring as body text / long borders /
    anything read continuously. Use the derived tones (steel, mist_text,
    border_soft, border_strong, blaze_accent, link_heading) for those
    surfaces instead.
  rules:
    - "pure black (#000000) and pure white (#ffffff) are never used"
    - "darkest point is iron #101411, lightest is steel #e8ecd8"
    - "every color has an industrial green-grey or rust-orange undertone, matching the heavy machinery aesthetic"