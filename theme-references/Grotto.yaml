name: Grotto
slug: Grotto

concept: >
  A hidden-waterfall / jungle-grotto aesthetic built around the colors
  of a sunlit cascade tucked deep in a mossy ravine.

feeling: >
  Standing at the edge of a pool where a waterfall drops through a
  canyon of dark wet stone -- near-black basalt walls, ferns and moss
  climbing every ledge, sprays of magenta and rose-pink blossoms
  clinging to the rock, white water crashing into blue-green pool
  below, and warm gold light breaking through the canopy far above.
  Quiet, damp, secret. A place you have to go looking for.

# ---------------------------------------------------------------------------
# RAW PALETTE
# ---------------------------------------------------------------------------
palette:
  hollow:      { hex: "#0a1512", role: "Primary background" }
  deep:        { hex: "#122620", role: "Alt background / surfaces" }
  shade:       { hex: "#1e3a30", role: "Segment midtone / borders" }
  dusk:        { hex: "#2f5245", role: "Hover states / inactive" }
  haze:        { hex: "#7fa08f", role: "Dimmed text / secondary" }
  petal:       { hex: "#c97a97", role: "Cursor / accent" }
  bloom:       { hex: "#e3aec8", role: "Lighter pink" }
  foam:        { hex: "#eaf5ec", role: "Primary foreground / text" }
  blossom:     { hex: "#d1467e", role: "Active / border" }
  moss:        { hex: "#17291f", role: "Inactive / border (dedicated Hyprland-inactive swatch -- distinct from the general `shade` alt-surface)" }
  orchid:      { hex: "#ff74ab", role: "Bright accent / highlights" }
  gold:        { hex: "#e8b84b", role: "Operators / warnings / sunbeam" }
  silver:      { hex: "#b9c9bf", role: "Muted text" }
  leaf:        { hex: "#6ea86a", role: "Success / ok states" }
  mist:        { hex: "#a9d8d4", role: "Escape sequences / info" }
  coral:       { hex: "#d9506f", role: "Errors / critical / urgent" }
  amber:       { hex: "#d98f4a", role: "Ember (shifted warm)" }
  mid_shadow:  { hex: "#183028", role: "Mid shadow -- swaync alt widget bg / notification bg" }
  grey1:       { hex: "#57796a", role: "Grey step between haze and dusk" }
  bright_green: { hex: "#8fd08c", role: "Starship-only bright mint (= ANSI bright_green)" }

extra:
  autosuggestions: "#24402f"
  mist_text:      { hex: "#9ab8ab", role: "Muted/secondary text (lifted haze)" }
  border_soft:    { hex: "#2a463c", role: "Inactive borders, hr, dividers" }
  border_strong:  { hex: "#3d6656", role: "Hover / visible borders" }

# ---------------------------------------------------------------------------
# SEMANTIC ROLES
# ---------------------------------------------------------------------------
semantic:
  background:             hollow
  surface:                deep
  alt_surface:            shade

  active_border:          blossom
  border_inactive_soft:   border_soft
  border_hover_strong:    border_strong

  hypr_border_active:     blossom
  hypr_border_inactive:   moss
  hypr_shadow:            blossom


  text_primary:           foam
  text_secondary:         haze
  cursor:                 petal
  fish_commands:          orchid
  fish_keywords:          petal
  fish_strings:           bloom
  fish_comments:          dusk

  operators:              gold
  escape_sequences:       mist
  autosuggestions:        autosuggestions
  success:                leaf
  warning:                gold
  error:                  coral

  hover:                  dusk
  selected:               blossom
  url:                    orchid

  reading_text_secondary: haze_text

  info:                   mist
  surface_mid:            mid_shadow
  muted_text:             silver
  ember_warm:             amber
  starship_green:         bright_green

glow:
  color: blossom
  alpha: 0.25

ansi:
  - { index: 0,  name: black,          hex: "#0a1512" }
  - { index: 1,  name: red,            hex: "#d9506f" }
  - { index: 2,  name: green,          hex: "#6ea86a" }
  - { index: 3,  name: yellow,         hex: "#c69a3c" }
  - { index: 4,  name: blue,           hex: "#4f8ca8" }
  - { index: 5,  name: magenta,        hex: "#d1467e" }
  - { index: 6,  name: cyan,           hex: "#7fc0ba" }
  - { index: 7,  name: white,          hex: "#b9c9bf" }
  - { index: 8,  name: bright_black,   hex: "#2f5245" }
  - { index: 9,  name: bright_red,     hex: "#f0748c" }
  - { index: 10, name: bright_green,   hex: "#8fd08c" }
  - { index: 11, name: bright_yellow,  hex: "#e8b84b" }
  - { index: 12, name: bright_blue,    hex: "#7db4d0" }
  - { index: 13, name: bright_magenta, hex: "#ff74ab" }
  - { index: 14, name: bright_cyan,    hex: "#c8ece8" }
  - { index: 15, name: bright_white,   hex: "#eaf5ec" }

transparency:
  swaync_center:     { alpha: 0.92 }
  hyprlock_bg:       { brightness: 0.40, blur_passes: 4, blur_size: 8 }

typography:
  hyprlock:  "Iosevka Nerd Font Propo"

borders:
  kitty:             { active: blossom, inactive: dusk }

text:
  hyprlock_text: "the grotto keeps its secrets"

glyphs:
  prompt_success: "󰈸"
  prompt_error:   "⚡"
  vim_normal:     "🌿"
  git_branch:     "󰘬"
  dir_prefix:     "󰐆"
  home:           "󱂵"
  flavor_star:    "✦"
  os:             "󰣇"

fastfetch_logo: sword.txt

notes:
  readability: >
    Raw haze/dusk/shade/blossom/hollow read fine on a terminal bar or
    status line, but get muddy or tiring as body text / long borders /
    anything read continuously. Use the derived tones (stone, haze_text,
    border_soft, border_strong, blossom_accent, link_heading) for those
    surfaces instead.
  rules:
    - "pure black (#000000) and pure white (#ffffff) are never used"
    - "darkest point is hollow #0a1512, lightest is foam #eaf5ec"
    - "every color has a green/damp-stone undertone, even pinks and golds"
