name: Vespertine
slug: Vespertine

concept: >
  A twilight-city aesthetic built around a quiet rooftop overlooking a vast urban
  skyline at dusk, with smoldering coral-orange sunset clouds breaking across a
  deep slate-blue evening sky and warm apartment windows flickering on.

feeling: >
  Standing on a quiet rooftop high above the sprawling city as day fades
  into night[cite: 1]. The sky overhead is a deep, bruised navy-blue, slashed through
  by brilliant, glowing coral-orange sunset clouds[cite: 1]. Down below, windows
  begin to wink on with warm amber light[cite: 1], and a single candle flickers in
  the breeze[cite: 1]. A moment of quiet reflection amidst the urban expanse.

# ---------------------------------------------------------------------------
# RAW PALETTE -- every named color, its hex, and a small note about its usage.
# ---------------------------------------------------------------------------
palette:
  midnight:    { hex: "#0b0f19", role: "Primary background" }
  deep:        { hex: "#141b2c", role: "Alt background / surfaces" }
  shadow:      { hex: "#1e2942", role: "Segment midtone / borders" }
  dusk:        { hex: "#2d3d5c", role: "Hover states / inactive" }
  mist:        { hex: "#8493af", role: "Dimmed text / secondary" }
  coral:       { hex: "#f27d52", role: "Cursor / accent" }
  sky:         { hex: "#8cbcd9", role: "Lighter sky-blue" }
  snow:        { hex: "#edf2f8", role: "Primary foreground / text" }
  sunset:      { hex: "#e86b45", role: "Active / border" }
  navy:        { hex: "#151d30", role: "Inactive / border (dedicated Hyprland-inactive swatch -- distinct from the general `shadow` alt-surface)" }
  peach:       { hex: "#ff9e7d", role: "Bright accent / highlights" }
  amber:       { hex: "#d99b36", role: "Operators / warnings / trim" }
  silver:      { hex: "#b0bcd4", role: "Muted text" }
  kelp:        { hex: "#5ecf9a", role: "Success / ok states" }
  cyan:        { hex: "#7ec8e3", role: "Escape sequences / info" }
  rust:        { hex: "#d95252", role: "Errors / critical / urgent" }
  ember:       { hex: "#d97a4a", role: "Warm shift (sunset ember)" }
  mid_shadow:  { hex: "#111726", role: "Mid shadow -- swaync alt widget bg / notification bg" }
  grey1:       { hex: "#536688", role: "Grey step between mist and dusk" }
  bright_green: { hex: "#7de8b0", role: "Starship-only bright mint (= ANSI bright_green)" }

# one-off colors that don't fit the named-swatch pattern
extra:
  autosuggestions: "#222f47"
  mist_text:     "#9bb0cb"
  border_soft:   "#253450"
  border_strong: "#3c5075"

# ---------------------------------------------------------------------------
# SEMANTIC ROLES -- every generator/template should reference THESE keys,
# never raw palette names directly. Values are palette/derived/extra keys,
# NOT hex codes, so re-theming = editing palette/derived above only.
# ---------------------------------------------------------------------------
semantic:
  background:             midnight
  surface:                deep
  alt_surface:            shadow

  active_border:          sunset
  border_inactive_soft:   border_soft
  border_hover_strong:    border_strong

  hypr_border_active:     sunset
  hypr_border_inactive:   navy
  hypr_shadow:            sunset

  text_primary:           snow
  text_secondary:         mist
  cursor:                 coral
  fish_commands:          peach
  fish_keywords:          coral
  fish_strings:           sky
  fish_comments:          dusk
  
  operators:              amber
  escape_sequences:       cyan
  autosuggestions:        autosuggestions
  success:                kelp
  warning:                amber
  error:                  rust
  
  hover:                  dusk
  selected:               sunset
  url:                    peach
  
  reading_text_secondary: mist_text

  info:                   cyan
  surface_mid:            mid_shadow
  muted_text:             silver
  ember_warm:             ember
  starship_green:         bright_green

glow:
  color: sunset
  alpha: 0.25

# ---------------------------------------------------------------------------
# ANSI 16-color terminal palette
# ---------------------------------------------------------------------------
ansi:
  - { index: 0,  name: black,          hex: "#0b0f19" }
  - { index: 1,  name: red,            hex: "#d95252" }
  - { index: 2,  name: green,          hex: "#5ecf9a" }
  - { index: 3,  name: yellow,         hex: "#c9933b" }
  - { index: 4,  name: blue,           hex: "#4a75a0" }
  - { index: 5,  name: magenta,        hex: "#e86b45" }
  - { index: 6,  name: cyan,           hex: "#6fc2c8" }
  - { index: 7,  name: white,          hex: "#b0bcd4" }
  - { index: 8,  name: bright_black,   hex: "#2d3d5c" }
  - { index: 9,  name: bright_red,     hex: "#f07373" }
  - { index: 10, name: bright_green,   hex: "#7de8b0" }
  - { index: 11, name: bright_yellow,  hex: "#f5b042" }
  - { index: 12, name: bright_blue,    hex: "#7ec8e3" }
  - { index: 13, name: bright_magenta, hex: "#ff9e7d" }
  - { index: 14, name: bright_cyan,    hex: "#a8e8ec" }
  - { index: 15, name: bright_white,   hex: "#edf2f8" }

# ---------------------------------------------------------------------------
# Transparency & blur
# ---------------------------------------------------------------------------
transparency:
  swaync_center:     { alpha: 0.92 }
  hyprlock_bg:       { brightness: 0.40, blur_passes: 4, blur_size: 8 }

# ---------------------------------------------------------------------------
# Typography
# ---------------------------------------------------------------------------
typography:
  hyprlock:  "Iosevka Nerd Font Propo"

# ---------------------------------------------------------------------------
# Borders & rounding
# ---------------------------------------------------------------------------
borders:
  kitty:             { active: sunset, inactive: dusk }

text:
  hyprlock_text: "watch the city fade to dusk"

# ---------------------------------------------------------------------------
# Key glyphs (Nerd Font)
# ---------------------------------------------------------------------------
glyphs:
  prompt_success: "󱔟"
  prompt_error:   "🌩"
  vim_normal:     "🏙"
  git_branch:     "󰘬"
  dir_prefix:     ""
  home:           "󱂵"
  flavor_star:    "✦"
  os:             "󰣇"

# ---------------------------------------------------------------------------
# Freeform notes about anything needing extra comments.
# ---------------------------------------------------------------------------
notes:
  readability: >
    Raw mist/dusk/shadow/sunset/midnight read fine on a terminal bar or
    status line, but get muddy or tiring as body text / long borders /
    anything read continuously. Use the derived tones (mist_text,
    border_soft, border_strong, sunset_accent, link_heading) for those
    surfaces instead.
  rules:
    - "pure black (#000000) and pure white (#ffffff) are never used"
    - "darkest point is midnight #0b0f19, lightest is snow #edf2f8"
    - "every color has a cool slate-blue evening undertone, even warm sunset oranges lean atmospheric"