name: Glade
slug: Glade          # used for dir names, wallpaper folder, etc.

concept: >
  A forest / sun-dappled canopy aesthetic built around the resting
  traveler under the great tree in wallpapers/Glade -- deep mossy
  shadow, warm bark, and shafts of golden light broken up by leaves.

feeling: >
  Lying back on a wide old branch, basket of gathered greens hanging
  beside you, straw hat tipped over your eyes -- the canopy overhead
  is a hundred shades of green, shifting as the wind moves the leaves.
  Sunlight doesn't fall so much as filter, landing in warm gold coins
  on bark and cloth. Below, the world blurs into a soft pale mist.
  Nothing to do but breathe and watch the light move.

# ---------------------------------------------------------------------------
# RAW PALETTE -- every named color, its hex, and a small note about its usage.
# ---------------------------------------------------------------------------
palette:
  hollow:      { hex: "#10160c", role: "Primary background" }
  deep:        { hex: "#1b2612", role: "Alt background / surfaces" }
  shadow:      { hex: "#2a3a1c", role: "Segment midtone / borders" }
  dusk:        { hex: "#3f5427", role: "Hover states / inactive" }
  mist:        { hex: "#8a9d76", role: "Dimmed text / secondary" }
  moss:        { hex: "#5f9142", role: "Cursor / accent" }
  dapple:      { hex: "#b8d17a", role: "Lighter sun-through-leaves green" }
  canvas:      { hex: "#f0efd8", role: "Primary foreground / text (robe white)" }
  fern:        { hex: "#3f7d3a", role: "Active / border" }
  bark:        { hex: "#4a3323", role: "Inactive / border (dedicated Hyprland-inactive swatch -- distinct from the general `shadow` alt-surface)" }
  sunbeam:     { hex: "#d9c268", role: "Bright accent / highlights" }
  brass:       { hex: "#c9a24a", role: "Operators / warnings / trim" }
  silver:      { hex: "#b9c2a8", role: "Muted text" }
  kelp:        { hex: "#6fbf73", role: "Success / ok states" }
  haze:        { hex: "#8fb8ac", role: "Escape sequences / info (misty horizon)" }
  rust:        { hex: "#c05a3f", role: "Errors / critical / urgent (bark scar)" }
  ember:       { hex: "#d1793f", role: "Warm shift (sun-warmed wood)" }
  mid_shadow:  { hex: "#1c2814", role: "Mid shadow -- swaync alt widget bg / notification bg" }
  grey1:       { hex: "#5a7048", role: "Grey step between mist and dusk" }
  bright_green: { hex: "#8fd45c", role: "Starship-only bright leaf (= ANSI bright_green)" }

# one-off colors that don't fit the named-swatch pattern
extra:
  autosuggestions: "#2a3a1f"
  mist_text:       "#a8ba93"   # mist lightened for continuous reading (long body text)
  border_soft:     "#33461f"   # muted border, between shadow and dusk
  border_strong:   "#6da84a"   # brighter hover border, between moss and dapple

# ---------------------------------------------------------------------------
# SEMANTIC ROLES -- every generator/template should reference THESE keys,
# never raw palette names directly. Values are palette/derived/extra keys,
# NOT hex codes, so re-theming = editing palette/derived above only.
# ---------------------------------------------------------------------------
semantic:
  background:             hollow
  surface:                 deep
  alt_surface:             shadow

  active_border:           fern
  border_inactive_soft:    border_soft
  border_hover_strong:     border_strong

  hypr_border_active:      fern
  hypr_border_inactive:    bark
  hypr_shadow:             fern

  text_primary:            canvas
  text_secondary:          mist
  cursor:                  moss
  fish_commands:           sunbeam
  fish_keywords:           moss
  fish_strings:            dapple
  fish_comments:           dusk

  operators:               brass
  escape_sequences:        haze
  autosuggestions:         autosuggestions
  success:                 kelp
  warning:                 brass
  error:                   rust

  hover:                   dusk
  selected:                fern
  url:                     sunbeam

  reading_text_secondary:  mist_text

  info:                    haze
  surface_mid:             mid_shadow
  muted_text:              silver
  ember_warm:              ember
  starship_green:          bright_green

glow:
  color: fern
  alpha: 0.25

# ---------------------------------------------------------------------------
# ANSI 16-color terminal palette
# ---------------------------------------------------------------------------
ansi:
  - { index: 0,  name: black,          hex: "#10160c" }
  - { index: 1,  name: red,            hex: "#c05a3f" }
  - { index: 2,  name: green,          hex: "#6fbf73" }
  - { index: 3,  name: yellow,         hex: "#b8963f" }
  - { index: 4,  name: blue,           hex: "#4f6f7a" }
  - { index: 5,  name: magenta,        hex: "#3f7d3a" }
  - { index: 6,  name: cyan,           hex: "#7fb0a8" }
  - { index: 7,  name: white,          hex: "#b9c2a8" }
  - { index: 8,  name: bright_black,   hex: "#3f5427" }
  - { index: 9,  name: bright_red,     hex: "#d97a5a" }
  - { index: 10, name: bright_green,   hex: "#8fd45c" }
  - { index: 11, name: bright_yellow,  hex: "#d9c268" }
  - { index: 12, name: bright_blue,    hex: "#7fa3ac" }
  - { index: 13, name: bright_magenta, hex: "#7fcf6a" }
  - { index: 14, name: bright_cyan,    hex: "#bcdfd8" }
  - { index: 15, name: bright_white,   hex: "#f0efd8" }

# ---------------------------------------------------------------------------
# Transparency & blur
# ---------------------------------------------------------------------------
transparency:
  swaync_center:     { alpha: 0.92 }
  hyprlock_bg:       { brightness: 0.40, blur_passes: 4, blur_size: 8 }

# ---------------------------------------------------------------------------
# Typography
# ---------------------------------------------------------------------------
typography:
  hyprlock:  "Iosevka Nerd Font Propo"

# ---------------------------------------------------------------------------
# Borders & rounding
# ---------------------------------------------------------------------------
borders:
  kitty:             { active: fern, inactive: dusk }

text:
  hyprlock_text: "awaken the glade"

# ---------------------------------------------------------------------------
# Key glyphs (Nerd Font)
# ---------------------------------------------------------------------------
glyphs:
  prompt_success: "🌿"
  prompt_error:   "🍂"
  vim_normal:     "🌳"
  git_branch:     "󰘬"
  dir_prefix:     "🧺"
  home:           "󱂵"
  flavor_star:    "✦"
  os:             "󰣇"

fastfetch_logo: tree.txt

# ---------------------------------------------------------------------------
# Freeform notes about anything needing extra comments.
# ---------------------------------------------------------------------------
notes:
  readability: >
    Raw mist/dusk/shadow/fern/hollow read fine on a terminal bar or
    status line, but get muddy or tiring as body text / long borders /
    anything read continuously. Use the derived tones (parchment,
    mist_text, border_soft, border_strong, moss_accent, link_heading)
    for those surfaces instead.
  rules:
    - "pure black (#000000) and pure white (#ffffff) are never used"
    - "darkest point is hollow #10160c, lightest is canvas #f0efd8"
    - "every color has a green/gold forest undertone, even reds and blues lean warm or earthy"